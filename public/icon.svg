<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gymVolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10e761" />
      <stop offset="100%" stop-color="#0db84e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#10e761" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Obsidian Background with rounded aesthetic -->
  <rect width="32" height="32" rx="8" fill="#07090e"/>
  <rect width="30" height="30" x="1" y="1" rx="7" fill="#101620" stroke="rgba(16, 231, 97, 0.3)" stroke-width="1"/>
  
  <!-- Tactical Athletic Dumbbell Icon -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <line x1="4.5" y1="15.5" x2="15.5" y2="4.5" stroke="url(#gymVolt)" stroke-width="2.6" stroke-linecap="round"/>
    
    <!-- Left Outer Weight Plate -->
    <line x1="2" y1="14" x2="6" y2="18" stroke="url(#gymVolt)" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Left Inner Weight Plate -->
    <line x1="3.5" y1="12.5" x2="7.5" y2="16.5" stroke="url(#gymVolt)" stroke-width="2.8" stroke-linecap="round"/>
    
    <!-- Right Inner Weight Plate -->
    <line x1="12.5" y1="3.5" x2="16.5" y2="7.5" stroke="url(#gymVolt)" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Right Outer Weight Plate -->
    <line x1="14" y1="2" x2="18" y2="6" stroke="url(#gymVolt)" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>
